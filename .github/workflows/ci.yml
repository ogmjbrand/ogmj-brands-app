name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # fetch-depth 0 is deliberate: tests/routes.spec.ts compares the routes
      # on disk against `git ls-files`, which needs a real repository rather
      # than a bare export. That test exists because a stray `.gitignore`
      # pattern once excluded an entire route from version control, and the
      # only reason it was ever noticed is that a fresh checkout lacked it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No CHROMIUM_PATH here: unset, Playwright uses the browser it manages
      # itself. The variable exists only for environments that ship one.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:only

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
